# Secret đọc từ file .env ở thư mục gốc (không commit); xem .env.example.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutriplan
      POSTGRES_USER: nutriplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env ở thư mục gốc}
    ports:
      - "5432:5432"
    volumes:
      - nutriplan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://nutriplan:${POSTGRES_PASSWORD}@postgres:5432/nutriplan?schema=public
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong file .env ở thư mục gốc}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5-mini}
      AI_CHAT_DAILY_LIMIT: ${AI_CHAT_DAILY_LIMIT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EXPIRY_EMAIL_TIME: ${EXPIRY_EMAIL_TIME:-}
      # Upload ảnh (tùy chọn): đủ cả ba hoặc để trống cả ba (khi đó API upload trả 503).
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RECEIPT_SCAN_DAILY_LIMIT: ${RECEIPT_SCAN_DAILY_LIMIT:-}
      # Bảo mật (GĐ4): request đi qua nginx của frontend (1 proxy) → rate limit đọc IP thật từ X-Forwarded-For.
      TRUST_PROXY: 1
      # Để trống = cookie refresh token Secure (production); đặt false nếu mở demo bằng http qua IP mạng LAN.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Chỉ seed đọc (tạo tài khoản Admin, cập nhật lại món gốc); để trống thì seed bỏ qua.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_UPDATE_RECIPES: ${SEED_UPDATE_RECIPES:-false}
    # Chỉ nghe trên máy chủ (127.0.0.1): người dùng và trình duyệt gọi API qua nginx của frontend (cổng 8080, /api/), nên không
    # gọi thẳng được cổng 4000 từ máy khác để giả X-Forwarded-For lách rate limit.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  nutriplan_postgres:
