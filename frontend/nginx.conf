server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén gzip tệp chữ (HTML, JS, CSS, SVG, JSON — gồm phản hồi API qua proxy); ảnh và phông woff2 vốn đã nén.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  location /api/ {
    # Ảnh tải lên tối đa 5 MB (backend kiểm tra chính xác); để dư cho phần đầu multipart.
    client_max_body_size 6m;
    proxy_pass http://backend:4000/api/;
    # Tạo thực đơn bằng OpenAI tới 120 giây (backend tự chuyển dự phòng khi quá hạn): chờ dư so với 60 giây mặc định.
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html luôn hỏi lại server (ETag) trước khi dùng bản đệm: không có dòng này trình duyệt tự đoán hạn đệm theo
  # Last-Modified và có thể mở index.html cũ trỏ tới CSS/JS cũ sau khi build lại (giao diện "không đổi" dù mã đã sửa).
  # Tệp trong assets/ do Vite đặt tên theo mã băm nên vẫn được đệm bình thường.
  # Header bảo mật cho trang và tệp tĩnh. Đặt trong từng location (add_header trong location bỏ header khai báo ở server);
  # không đặt cho /api/: backend (helmet) đã gửi header riêng, thêm ở đây sẽ thành hai X-Frame-Options mâu thuẫn. Chưa có CSP
  # (ảnh Cloudinary, phông Google).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
